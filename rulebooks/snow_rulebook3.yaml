---
- name: ServiceNow to EDA Integration
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Trigger Remediation on High Priority Incident
      condition: event.payload.state == "New" and event.payload.priority == '1'
      action:
        run_job_template:
          name: "Demo-Cleiton-Template"
          organization: "Default"
          
