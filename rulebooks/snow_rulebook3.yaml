---
- name: ServiceNow to EDA Integration
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Trigger Remediation on High Priority Incident
      condition: event.payload.priority == '1'
      action:
        run_job_template:
          name: "Demo-Cleiton-Template"
          organization: "Default"
          job_args:
            extra_vars:
              incident_id: "{{ event.payload.incident_number }}"
              short_description: "{{ event.payload.short_description }}"
          
