- name: Poll for new records in ServiceNow
  hosts: all
  sources:
    - name: my_snow
      servicenow.itsm.records:
        table: incident
        interval: 10
        sysparm_query: "state=1^priority=4"
        timestamp_field: "sys_updated_on"
      
  rules:
    - name: Enrich new INCIDENT received from service catalog
      condition: event.payload.incident_number is defined
      action:
        run_job_template:
          name: "Demo-Cleiton-Template"
          organization: "Default"
          post_events: true
          job_args:
            extra_vars:
              req_number: "{{ event.number }}"