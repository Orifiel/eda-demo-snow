---
- name: Kafka Listening Rulebook
  hosts: all
  sources:
    - ansible.eda.kafka:
        host: "kafkavm.cmattos.tamlab.rdu2.redhat.com"
        port: "9092"
        topic: "TESTE"
        offset: earliest
        group_id: "eda_teste_consumer_group"

  rules:
    - name: DEBUG - Print any event that arrives
      condition: event.payload is defined
      action:
        run_job_template:
          name: "Demo Job Template"
          organization: "Default"
        
    - name: show event messages
      condition: event.body.message is defined
      action:
        debug:
          msg: "{{ event.body.message }}"    

    
