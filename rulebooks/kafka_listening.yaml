---
- name: Kafka Listening Rulebook
  hosts: all
  sources:
    - ansible.eda.kafka:
        host: "kafkavm.cmattos.tamlab.rdu2.redhat.com"
        port: "9092"
        topic: "TESTE"        

  rules:
    - name: DEBUG - Print any event that arrives
      condition: event.body is defined and event.body is match("Automa.\*")
      action:
        run_job_template:
          name: "Demo Job Template"
          organization: "Default"
        
    - name: show event messages
      condition: event.body == Cleiton
      action:
        debug:
          msg: "{{ event.body }}"    

    
